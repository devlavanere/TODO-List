<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZG Hero - TODO List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>TODO List MVP</h1>
    <div class="dashboard">
        <span class="badge todo">TODO: <span id="count-todo">0</span></span>
        <span class="badge doing">DOING: <span id="count-doing">0</span></span>
        <span class="badge done">DONE: <span id="count-done">0</span></span>
    </div>
</header>

<main class="container">
    <!-- Formulário (Create / Update) -->
    <section class="form-section">
        <h2 id="form-title">Nova Tarefa</h2>
        <form id="task-form">
            <input type="hidden" id="task-id">

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" required>
            </div>
            <div class="form-group-row">
                <div class="form-group">
                    <label for="data">Data Término:</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label for="prioridade">Prioridade:</label>
                    <input type="number" id="prioridade" min="1" max="5" required>
                </div>
            </div>
            <div class="form-group-row">
                <div class="form-group">
                    <label for="categoria">Categoria:</label>
                    <input type="text" id="categoria" required>
                </div>
                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status">
                        <option value="TODO">TODO</option>
                        <option value="DOING">DOING</option>
                        <option value="DONE">DONE</option>
                    </select>
                </div>
            </div>
            <button type="submit" id="btn-submit">Salvar Tarefa</button>
            <button type="button" id="btn-cancel" class="btn-cancel" style="display: none;">Cancelar Edição</button>
        </form>
    </section>

    <!-- Filtros, Ações em Lote e Listagem (Read / Update / Delete) -->
    <section class="list-section">
        <h2>Minhas Tarefas</h2>
        <div class="filters">
            <button class="btn-filter active" data-filter="ALL">Todas</button>
            <button class="btn-filter" data-filter="TODO">TODO</button>
            <button class="btn-filter" data-filter="DOING">DOING</button>
            <button class="btn-filter" data-filter="DONE">DONE</button>
        </div>

        <!-- Barra de alteração de status para múltiplas tarefas -->
        <div class="bulk-actions">
            <label class="select-all-label">
                <input type="checkbox" id="select-all">
                <span>Selecionar todas (<span id="selected-count">0</span>)</span>
            </label>

            <div class="bulk-controls">
                <select id="bulk-status" aria-label="Novo status para tarefas selecionadas">
                    <option value="TODO">Mover para TODO</option>
                    <option value="DOING">Mover para DOING</option>
                    <option value="DONE" selected>Mover para DONE</option>
                </select>
                <button type="button" id="btn-bulk-execute" class="btn-bulk" disabled>Executar</button>
            </div>
        </div>

        <div id="task-list" class="task-list">
            <!-- Espaço para injetar as tarefas com JS -->
        </div>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
